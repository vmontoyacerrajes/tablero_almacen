services:
  api:
    build:
      context: ./backend
    env_file: [.env]
    environment:
      - TZ=${TZ}
      - API_CORS_ORIGINS=${API_CORS_ORIGINS}
      # === Nuevo origen de datos: JSON mensual de Moving ===
      - DATA_SOURCE=json
      # Patrón del archivo mensual. Ej: 2025-09.json
      - DASH_JSON_URL_TEMPLATE=https://mov.cerraco.mx/temp/dash/{yyyy}-{mm}.json
      # Cache (segundos) para no pegarle al JSON en cada request (10 min = 600s)
      - JSON_CACHE_TTL=600
      # Directorio interno para cacheo (no lo cambies si no es necesario)
      - JSON_CACHE_DIR=/app/.cache/dashjson
      # (Opcional) Lista blanca de dominios desde los que se puede leer JSON
      - ALLOWED_JSON_DOMAINS=mov.cerraco.mx
      # Si tu backend aún usa DB para otras cosas, puedes dejar DB_URI presente.
      - DB_URI=${DB_URI}
    volumes:
      # Monta el código del backend en el contenedor (DEV): así ve cambios sin rebuild
      - ./backend:/app
      # Persistimos un directorio de cache en host para reutilizar entre reinicios
      - ./data/cache:/app/.cache/dashjson
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    image: nginx:alpine
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    environment:
      - TZ=${TZ}
    ports:
      - "8080:80"
    restart: unless-stopped

